<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gnosis.WebUI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Gnosis.WebUI.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/fondo-dinamico.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        window.gnosis = {
            iniciarArrastre: function (panelId, dotnetRef, offsetX, offsetY) {
                const el = document.getElementById(panelId);
                if (!el) return;

                el.style.transition = 'none';

                function onMove(e) {
                    el.style.left = (e.clientX - offsetX) + 'px';
                    el.style.top = (e.clientY - offsetY) + 'px';
                    el.style.right = 'auto';
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    el.style.transition = '';
                    dotnetRef.invokeMethodAsync('ActualizarPosicion', panelId,
                        parseFloat(el.style.left), parseFloat(el.style.top));
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            }
        };
    </script>
</body>

</html>
