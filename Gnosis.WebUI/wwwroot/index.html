<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gnosis.WebUI</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Gnosis.WebUI.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/fondo-dinamico.css" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>

    <!-- ========================================== -->
    <!-- NUEVO: Cargar sonidos después de Blazor    -->
    <!-- ========================================== -->
    <script src="js/sonidos.js"></script>

    <script>
        // No reemplazamos window.gnosis (eso borraría reproducirSonido/reproducirTick/reproducirAlarma
        // que sonidos.js ya le agregó arriba); lo extendemos en su lugar.
        window.gnosis = window.gnosis || {};
        Object.assign(window.gnosis, {
            iniciarArrastre: function (panelId, dotnetRef, offsetX, offsetY, minimizado) {
                const el = document.getElementById(panelId);
                if (!el) return;

                el.style.transition = 'none';

                // Distingue un clic simple de un arrastre real: solo se considera
                // arrastre si el mouse se movió más allá de un pequeño umbral.
                let seMovio = false;
                let inicioX = null;
                let inicioY = null;
                const UMBRAL_ARRASTRE = 4;

                function onMove(e) {
                    if (inicioX === null) {
                        inicioX = e.clientX;
                        inicioY = e.clientY;
                    }
                    if (!seMovio) {
                        const dx = e.clientX - inicioX;
                        const dy = e.clientY - inicioY;
                        if (Math.sqrt(dx * dx + dy * dy) > UMBRAL_ARRASTRE) {
                            seMovio = true;
                        }
                    }

                    if (minimizado) {
                        const mitad = window.innerWidth / 2;
                        el.style.top = (e.clientY - offsetY) + 'px';

                        if (e.clientX < mitad) {
                            el.style.left = '0px';
                            el.style.right = 'auto';
                        } else {
                            el.style.right = '0px';
                            el.style.left = 'auto';
                        }
                    } else {
                        el.style.left = (e.clientX - offsetX) + 'px';
                        el.style.top = (e.clientY - offsetY) + 'px';
                        el.style.right = 'auto';
                    }
                }

                function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    el.style.transition = '';

                    // Fue un clic, no un arrastre: no notificar nueva posición
                    // (así el toggle de minimizar/expandir sigue funcionando).
                    if (!seMovio) return;

                    const finalX = el.style.left === 'auto'
                        ? window.innerWidth - el.offsetWidth
                        : parseFloat(el.style.left);
                    const finalY = parseFloat(el.style.top);

                    // Notificar a Blazor la nueva posición
                    if (dotnetRef) {
                        try {
                            dotnetRef.invokeMethodAsync('ActualizarPosicion', panelId, finalX, finalY);
                        } catch (e) {
                            console.log('Error al notificar posición:', e);
                        }
                    }
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            },

            reproductorAudio: {
                player: null,
                listo: false,

                cargar: function (videoId) {
                    if (window.gnosis.reproductorAudio.player && window.gnosis.reproductorAudio.listo) {
                        window.gnosis.reproductorAudio.player.loadVideoById(videoId);
                        window.gnosis.reproductorAudio.player.playVideo();
                        return;
                    }

                    if (window.gnosis.reproductorAudio.player) {
                        window.gnosis.reproductorAudio.player.destroy();
                        window.gnosis.reproductorAudio.player = null;
                    }

                    window.gnosis.reproductorAudio.player = new YT.Player('yt-audio-player', {
                        height: '1',
                        width: '1',
                        videoId: videoId,
                        playerVars: {
                            autoplay: 1,
                            controls: 0,
                            loop: 1,
                            playlist: videoId,
                            modestbranding: 1,
                            rel: 0
                        },
                        events: {
                            onReady: function (e) {
                                window.gnosis.reproductorAudio.listo = true;
                                e.target.setVolume(80);
                                e.target.playVideo();
                            }
                        }
                    });
                },

                play: function () {
                    if (window.gnosis.reproductorAudio.player && window.gnosis.reproductorAudio.listo)
                        window.gnosis.reproductorAudio.player.playVideo();
                },

                pause: function () {
                    if (window.gnosis.reproductorAudio.player && window.gnosis.reproductorAudio.listo)
                        window.gnosis.reproductorAudio.player.pauseVideo();
                },

                setVolume: function (vol) {
                    if (window.gnosis.reproductorAudio.player && window.gnosis.reproductorAudio.listo)
                        window.gnosis.reproductorAudio.player.setVolume(vol);
                },

                estaReproduciendo: function () {
                    if (!window.gnosis.reproductorAudio.player || !window.gnosis.reproductorAudio.listo)
                        return false;
                    return window.gnosis.reproductorAudio.player.getPlayerState() === 1;
                }
            },

            notificaciones: {
                solicitarPermiso: async function () {
                    try {
                        if (!('Notification' in window)) return;
                        if (Notification.permission === 'default') {
                            await Notification.requestPermission();
                        }
                    } catch (e) {
                        console.log('Error al solicitar permiso de notificaciones:', e);
                    }
                },

                notificar: function (titulo, cuerpo) {
                    try {
                        if (!('Notification' in window)) return;
                        if (Notification.permission !== 'granted') return;
                        new Notification(titulo, { body: cuerpo, icon: 'icon-192.png' });
                    } catch (e) {
                        console.log('Error al mostrar notificacion:', e);
                    }
                }
            }
        });

        window.onYouTubeIframeAPIReady = function () { };
    </script>

    <!-- API de YouTube para el reproductor de audio -->
    <script src="https://www.youtube.com/iframe_api"></script>
</body>

</html>
